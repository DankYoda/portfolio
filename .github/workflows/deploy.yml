name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild weekly so the repo list picks up new projects and descriptions
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Repo is served at https://<user>.github.io/portfolio/, so assets need that base path
      - run: npx ng build --base-href /portfolio/

      # SPA fallback so deep links to client routes don't 404
      - run: cp dist/dakotafeist.github.io/browser/index.csr.html dist/dakotafeist.github.io/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/dakotafeist.github.io/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
